name: Deploy map to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set social preview URLs
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import os
          from html import escape
          from pathlib import Path
          from urllib.parse import urlsplit

          base = os.environ["PAGES_URL"].rstrip("/")
          url = urlsplit(base)
          if url.scheme not in {"https", "http"} or not url.netloc:
              raise SystemExit("GitHub Pages did not supply a valid site URL")

          index = Path("dist/index.html")
          source = index.read_text(encoding="utf-8")
          image = escape(f"{base}/assets/og-image.png", quote=True)
          page = escape(f"{base}/", quote=True)
          anchor = '<meta property="og:type" content="website">'
          source = source.replace('content="assets/og-image.png"', f'content="{image}"')
          source = source.replace(anchor, anchor + f'\n<meta property="og:url" content="{page}">\n<link rel="canonical" href="{page}">')
          index.write_text(source, encoding="utf-8")
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
